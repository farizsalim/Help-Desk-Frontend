<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCM Notification Test - Help Desk</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .status-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #667eea;
    }
    
    .status-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .status-value {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }
    
    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    
    .btn-danger {
      background: #ef4444;
    }
    
    .btn-danger:hover {
      background: #dc2626;
    }
    
    .log-container {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    
    .log-entry {
      color: #4ade80;
      margin-bottom: 5px;
      word-break: break-word;
    }
    
    .log-entry.error {
      color: #f87171;
    }
    
    .log-entry.info {
      color: #60a5fa;
    }
    
    .device-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    
    .badge-android {
      background: #4ade80;
      color: #065f46;
    }
    
    .badge-desktop {
      background: #9ca3af;
      color: #1f2937;
    }
    
    .token-display {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      color: #374151;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔔 FCM Notification Test</h1>
    <p class="subtitle">Test Firebase Cloud Messaging for mobile browsers</p>
    
    <div class="status-card">
      <div class="status-label">Device Type</div>
      <div class="status-value" id="deviceType">
        Detecting...
      </div>
    </div>
    
    <div class="status-card">
      <div class="status-label">Notification Permission</div>
      <div class="status-value" id="permissionStatus">Unknown</div>
    </div>
    
    <div class="status-card">
      <div class="status-label">FCM Token</div>
      <div class="status-value" id="tokenStatus">Not obtained</div>
      <div class="token-display" id="tokenDisplay" style="display: none;"></div>
    </div>
    
    <button class="btn" onclick="requestPermission()">
      📱 Enable Notifications
    </button>
    
    <button class="btn btn-secondary" onclick="sendTestNotification()" id="testBtn" disabled>
      🔔 Send Test Notification
    </button>
    
    <button class="btn btn-danger" onclick="unsubscribe()">
      ❌ Disable Notifications
    </button>
    
    <div class="log-container" id="logContainer">
      <div class="log-entry info">[INFO] Page loaded. Ready to test FCM notifications.</div>
    </div>
  </div>

  <script type="module">
    import { 
      initializeFirebase,
      requestFCMPermission,
      deleteFCMToken,
      getFCMToken,
      onForegroundMessage,
      isAndroidDevice
    } from './src/services/fcmService.js'

    const logContainer = document.getElementById('logContainer')
    const deviceTypeEl = document.getElementById('deviceType')
    const permissionStatusEl = document.getElementById('permissionStatus')
    const tokenStatusEl = document.getElementById('tokenStatus')
    const tokenDisplayEl = document.getElementById('tokenDisplay')
    const testBtn = document.getElementById('testBtn')

    // Log function
    window.log = (message, type = 'info') => {
      const entry = document.createElement('div')
      entry.className = `log-entry ${type}`
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`
      logContainer.appendChild(entry)
      logContainer.scrollTop = logContainer.scrollHeight
    }

    // Detect device type
    const isAndroid = isAndroidDevice()
    deviceTypeEl.innerHTML = `
      ${isAndroid ? 'Android Mobile' : 'Desktop/Other'}
      <span class="device-badge ${isAndroid ? 'badge-android' : 'badge-desktop'}">
        ${isAndroid ? 'ANDROID' : 'DESKTOP'}
      </span>
    `
    log(`Device detected: ${isAndroid ? 'Android' : 'Desktop'}`)

    // Check initial state
    const checkState = async () => {
      permissionStatusEl.textContent = Notification.permission
      
      if (isAndroid) {
        const token = localStorage.getItem('fcm_token')
        if (token) {
          tokenStatusEl.textContent = 'Token available'
          tokenDisplayEl.style.display = 'block'
          tokenDisplayEl.textContent = token
          testBtn.disabled = false
          log('FCM token found in localStorage', 'success')
        } else {
          tokenStatusEl.textContent = 'No token'
          log('No FCM token found', 'info')
        }
      }
    }

    checkState()

    // Request permission
    window.requestPermission = async () => {
      log('Requesting notification permission...', 'info')
      
      try {
        if (!isAndroid) {
          log('Note: This page is optimized for Android devices. Desktop will use standard Notification API.', 'info')
          const result = await Notification.requestPermission()
          permissionStatusEl.textContent = result
          log(`Permission result: ${result}`, result === 'granted' ? 'success' : 'error')
          return
        }

        const token = await requestFCMPermission()
        
        if (token) {
          permissionStatusEl.textContent = 'granted'
          tokenStatusEl.textContent = 'Token obtained!'
          tokenDisplayEl.style.display = 'block'
          tokenDisplayEl.textContent = token
          testBtn.disabled = false
          log('✅ FCM token obtained successfully!', 'success')
          
          // Setup foreground message listener
          onForegroundMessage((payload) => {
            log('📨 Foreground message received!', 'success')
            log(JSON.stringify(payload, null, 2), 'info')
            
            if (payload.notification) {
              log(`Title: ${payload.notification.title}`, 'info')
              log(`Body: ${payload.notification.body}`, 'info')
            }
          })
        } else {
          tokenStatusEl.textContent = 'Failed to get token'
          log('❌ Failed to obtain FCM token', 'error')
        }
      } catch (error) {
        log(`Error: ${error.message}`, 'error')
        console.error(error)
      }
    }

    // Send test notification (simulated)
    window.sendTestNotification = () => {
      log('🔔 Sending test notification...', 'info')
      
      // For testing purposes, we'll just show a local notification
      // In production, you would send this through your backend to Firebase Admin SDK
      if (Notification.permission === 'granted') {
        new Notification('Test Notification', {
          body: 'This is a test notification from FCM!',
          icon: '/vite.svg',
          badge: '/vite.svg',
          vibrate: [200, 100, 200]
        })
        log('✅ Test notification sent!', 'success')
      } else {
        log('⚠️ Permission not granted', 'error')
      }
    }

    // Unsubscribe
    window.unsubscribe = async () => {
      log('Disabling notifications...', 'info')
      
      try {
        if (isAndroid) {
          const success = await deleteFCMToken()
          if (success) {
            tokenStatusEl.textContent = 'Token deleted'
            tokenDisplayEl.style.display = 'none'
            testBtn.disabled = true
            log('✅ FCM token deleted successfully', 'success')
          } else {
            log('❌ Failed to delete token', 'error')
          }
        } else {
          log('Desktop: Cannot programmatically revoke permission. Please clear in browser settings.', 'info')
          localStorage.removeItem('fcm_token')
        }
      } catch (error) {
        log(`Error: ${error.message}`, 'error')
      }
    }

    // Handle visibility change
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        log('Page visible again, checking state...', 'info')
        checkState()
      }
    })
  </script>
</body>
</html>
